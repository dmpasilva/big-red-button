<div class="buttons-area">
  @for (number of numbers; track number; let idx = $index) {
    <app-button
      class="funky"
      [id]="'funky' + number"
      [buttonSize]="sizes.INHERIT"
      [active]="idx === 10"
    ></app-button>
  }
  <app-button class="funky" id="funky15" [buttonSize]="sizes.MEDIUM"></app-button>
</div>
